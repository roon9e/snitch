# snitch - Telegram moderator bot
#
#   cp .env.example .env      # then fill in BOT_TOKEN, CHAT_ID, RESTRICTED_USERS
#   docker compose up -d
#   docker compose logs -f
#
# The bot is long polling, so nothing is published to the host.

services:
  snitch:
    build:
      context: .
      dockerfile: Dockerfile
    # A local tag, built from this checkout. `pull_policy: build` is what stops
    # compose from trying to pull `snitch:1.0.0` from Docker Hub (an unnamespaced
    # reference is read as docker.io/library/snitch) and failing with
    # "pull access denied" before falling back to a local build.
    #
    # To run a published image instead, override on the command line:
    #   docker compose run --rm -e IMAGE=ghcr.io/roon9e/snitch:1.0.0 ...
    # see README "Using a prebuilt image".
    image: ${IMAGE:-snitch:1.0.0}
    pull_policy: build
    container_name: snitch

    # `on-failure:3` rather than `unless-stopped`: a wrong CHAT_ID or a missing
    # admin right is permanent, and restarting forever just buries the one
    # useful error message under a wall of identical stack traces. Transient
    # startup failures are retried inside the process (see __main__.STARTUP_ATTEMPTS),
    # so three container restarts is already generous. Raise this to `unless-stopped`
    # once the bot is running cleanly.
    restart: on-failure:3

    # Secrets stay in .env on the host and are injected at run time. They are
    # never baked into the image and never appear in `docker inspect` output as
    # build arguments.
    env_file:
      - .env

    environment:
      # Keep the container's own copy authoritative even if the host env leaks
      # a stray DATA_DIR.
      DATA_DIR: /app/data
      TZ: ${TZ:-UTC}

    volumes:
      # A *named* volume, not a bind mount. Docker seeds a new volume from the
      # image's /app/data, which the Dockerfile already chowns to 10001, so this
      # works with no host-side setup. A bind mount (./data:/app/data) inherits
      # the *host's* ownership instead, and the container's unprivileged uid
      # cannot write to it - which silently disables the audit log.
      #
      # To read violations.jsonl on the host, use a bind mount and fix the
      # ownership first:   chown -R 10001:10001 ./data
      - snitch-data:/app/data

    # PID 1 reaps zombies and forwards SIGTERM, so the bot can shut down
    # gracefully instead of being killed mid-request.
    init: true

    # Long enough for polling to unwind and the aiohttp session to close.
    stop_grace_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  snitch-data:
