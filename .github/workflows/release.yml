# Publishes a multi-architecture image to ghcr.io.
#
# Not run on ordinary pushes - only when a v* tag is pushed, so `main` never
# depends on registry access.
#
# PREREQUISITE (one-time, in the repository settings):
#   Settings -> Actions -> General -> Workflow permissions
#   -> Read and write permissions
#
# Then:  git tag v1.0.0 && git push origin v1.0.0
#
# Consumers pull with:
#   IMAGE=ghcr.io/roon9e/snitch:1.0.0 docker compose up -d

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # On workflow_dispatch, build the tag the operator asked for.
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `ref` must be passed explicitly: on workflow_dispatch github.ref is
          # the branch, not the tag, so semver patterns would match nothing and
          # the only tag produced would be "latest".
          ref: ${{ inputs.tag || github.ref }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the pushed image runs
        # steps.meta.outputs.tags is a MULTILINE list of every tag, and
        # outputs.version is not reliably a full reference (on a non-semver ref
        # it collapses to a bare "latest"). Taking the first line is the only
        # formulation that works in every case: expanding the whole list inline
        # would make bash try to execute the first line as a command.
        run: |
          set -euo pipefail
          primary="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -1)"
          echo "primary tag: $primary"
          test -n "$primary"
          docker pull --platform linux/amd64 "$primary"
          docker run --rm --platform linux/amd64 --entrypoint sh "$primary" -c \
            'python -c "import snitch, aiogram, aiohttp_socks; print(snitch.__version__, aiogram.__version__)"'
          echo "tags published:"
          printf '%s\n' '${{ steps.meta.outputs.tags }}'
