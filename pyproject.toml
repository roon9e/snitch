[project]
name = "snitch"
version = "1.0.0"
description = "Telegram moderator bot that enforces a no-contact rule between selected users, with a whitelisted forum topic escape hatch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["telegram", "bot", "moderation", "forum", "topics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "aiogram>=3.29,<4",
    "aiohttp-socks>=0.11",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
]

[project.scripts]
snitch = "snitch.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snitch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
# A hung test must fail the run, not stall it. thread method rather than signal,
# so it still works under pytest-asyncio's event loop. This exists because a
# test performing a real DNS lookup wedged a CI run: loop.getaddrinfo runs in the
# default ThreadPoolExecutor, cannot be cancelled, and is joined at teardown.
timeout = 60
timeout_method = "thread"
filterwarnings = ["error::DeprecationWarning:snitch.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8 naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "ASYNC",# asyncio correctness
    "RUF",  # ruff-specific
    "C4",   # comprehensions
    "DTZ",  # naive datetimes
    "T20",  # no print()
    "PTH",  # use pathlib
    "LOG",  # logging misuse
    "ARG",  # unused arguments
    "SLF",  # private member access
]
ignore = ["LOG015"]

[tool.ruff.lint.per-file-ignores]
# Tests may reach into private helpers on purpose, and asserts are the point.
"tests/*" = ["S101", "SLF001"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_any_unimported = false
mypy_path = "src"
packages = ["snitch"]

[[tool.mypy.overrides]]
module = ["aiogram.*"]
ignore_missing_imports = true
